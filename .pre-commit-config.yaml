repos:
  - repo: local
    hooks:
      - id: npm-test
        name: npm test
        entry: npm run test
        language: system
        pass_filenames: false
        files: ^src/.*\.(ts|tsx|js|jsx)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: sort-simple-yaml
